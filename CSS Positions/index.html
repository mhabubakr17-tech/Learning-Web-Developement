<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Positions</title>
    <style>
        .box {
        border: 2px solid black;
        margin: 5px;
        height: 100px;
        width: 80vw;
      }
      * {
        padding: 0;
        margin: 0;
      }
      
      .box2 {
        background-color: cadetblue;
        position: absolute;
        /* top: 0; */
        right: 0;
        bottom: 0;
        /* left: 100px; */
      }
      .box3 {
        background-color: yellowgreen;
      }
      .box4 {
        background-color: turquoise;
      }
      .parent {
        /* position: absolute; */
        padding: 10px;
        margin: 10px;
        border: 5px solid black;
        /* filter: invert(0); */
        perspective: 0em;
      }
      .bigbox{
        height: 150vh;
      }
      .box1 {
        background-color: aqua;
        position: sticky;
        top: 0;
        height: 50px;
      }
    </style>
  </head>
  <body>
    <div class="parent bigbox">
      <div class="box box1"></div>
      <div class="box box2"></div>
      <div class="box box3"></div>
      <div class="box box4"></div>
    </div>
  </body>
</html>
